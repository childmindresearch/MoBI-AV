[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-audio-stream"
version = "0.1.0"
description = "Audio and video streaming application"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "pyaudio",
    "opencv-python",
    "pylsl",
]

[project.scripts]
mobi-av = "run:main"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = [
    "run.py",
    "recorder_core.py",
    "audio_recorder.py",
    "video_recorder.py",
    "gui.py",
    "lsl_utils.py",
]

[dependency-groups]
dev = [
    "mypy>=1.14.1",
    "pytest>=8.3.5",
    "ruff>=0.16.10",
]
